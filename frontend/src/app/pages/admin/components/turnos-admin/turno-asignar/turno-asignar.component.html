<app-modal
  titulo="Nuevo turno de riego"
  subtitulo="Elija el sector y el horario semanal. Lo recibe el representante del sector."
  icono="ri-drop-line"
  tamano="sm"
  [bloqueado]="guardando()"
  (cerrar)="cerrar.emit()"
>
  <div class="modal__body form-stack">
    <p class="form-legend"><span class="req" aria-hidden="true">*</span> Campos obligatorios</p>

    <div class="form-group">
      <label for="turno-sector">Sector <span class="req" aria-hidden="true">*</span></label>
      <select
        id="turno-sector"
        class="input"
        [(ngModel)]="turno.sector_id"
        required
        [disabled]="cargandoSectores()"
      >
        <option [ngValue]="null">
          {{ cargandoSectores() ? 'Cargando sectores…' : 'Seleccionar sector…' }}
        </option>
        @for (s of sectores(); track s.id) {
          <option [ngValue]="s.id">{{ s.nombre }}</option>
        }
      </select>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label for="turno-dia">Día <span class="req" aria-hidden="true">*</span></label>
        <select id="turno-dia" class="input" [(ngModel)]="turno.dia_semana" required>
          @for (d of dias; track d.valor) {
            <option [ngValue]="d.valor">{{ d.label }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="turno-inicio">Inicio <span class="req" aria-hidden="true">*</span></label>
        <input
          id="turno-inicio"
          type="time"
          class="input"
          [(ngModel)]="turno.hora_inicio"
          required
        />
      </div>
      <div class="form-group">
        <label for="turno-fin">Fin <span class="req" aria-hidden="true">*</span></label>
        <input id="turno-fin" type="time" class="input" [(ngModel)]="turno.hora_fin" required />
      </div>
    </div>

    <div class="form-group">
      <label for="turno-obs">Observaciones <span class="opt">(Opcional)</span></label>
      <textarea
        id="turno-obs"
        class="input"
        [(ngModel)]="turno.observacion"
        rows="2"
        placeholder="Ej. Riego por la toma norte del canal…"
      ></textarea>
    </div>
  </div>

  <div class="modal__footer">
    <button type="button" class="btn btn--outline" data-cancelar [disabled]="guardando()">
      Cancelar
    </button>
    <button type="button" class="btn btn--primary" (click)="guardar()" [disabled]="guardando()">
      @if (guardando()) {
        <span class="spinner spinner--sm" aria-hidden="true"></span> Guardando…
      } @else {
        <i class="ri-save-line" aria-hidden="true"></i> Guardar turno
      }
    </button>
  </div>
</app-modal>
